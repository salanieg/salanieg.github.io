<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>U-Bahn Simulator U1 Nürnberg - Web3D</title>
    <meta name="description" content="Technisch korrekter und optisch ansprechender 3D-U-Bahn-Simulator der U-Bahn-Linie 1 in Nürnberg mit Three.js, WebGL und physikalischer Fahrsimulation.">
    <link rel="stylesheet" href="./src/style.css?v=41">
    
    <!-- ES Module Importmap for Three.js (self-hosted, no external CDN) -->
    <script type="importmap">
      {
        "imports": {
          "three": "./src/vendor/three/three.module.min.js",
          "three/addons/": "./src/vendor/three/addons/"
        }
      }
    </script>
</head>
<body>
    <!-- Splash / Initialization Screen -->
    <div id="splash" class="splash-overlay">
        <div class="splash-content">
            <h1>Steuerung</h1>
            
            <div class="control-tips">
                <ul>
                    <li><span>Beschleunigen</span> <span><kbd>W</kbd> / <kbd>↑</kbd></span></li>
                    <li><span>Bremsen</span> <span><kbd>S</kbd> / <kbd>↓</kbd></span></li>
                    <li><span>Notbremse</span> <span><kbd>Leertaste</kbd></span></li>
                    <li><span>Türen freigeben / schließen</span> <span><kbd>D</kbd></span></li>
                    <li><span>Fahrertür öffnen / schließen</span> <span><kbd>F</kbd></span></li>
                    <li><span>Signalhorn (Gong)</span> <span><kbd>H</kbd></span></li>
                    <li><span>Autopilot (ATO)</span> <span><kbd>A</kbd></span></li>
                    <li><span>Kamera wechseln</span> <span><kbd>1</kbd> - <kbd>4</kbd></span></li>
                </ul>
            </div>
            
            <button id="btn-start" class="start-btn">Simulation starten</button>
        </div>
    </div>

    <!-- Main App Layout (fullscreen, no HUD overlays) -->
    <div id="app">
        <main id="viewport-container">
            <div id="canvas3d"></div>

            <!-- Floating Camera HUD -->
            <div class="camera-hud">
                <button class="cam-btn active" data-cam="cab">Cockpit</button>
                <button class="cam-btn" data-cam="passenger">Fahrgast</button>
                <button class="cam-btn" data-cam="platform">Bahnsteig</button>
                <button class="cam-btn" data-cam="orbit">Außen</button>
            </div>

            <!-- Teleport HUD Overlay (Bottom Right) -->
            <div class="teleport-hud">
                <label for="teleport-select">Teleport:</label>
                <select id="teleport-select">
                    <option value="" disabled selected>Station wählen...</option>
                </select>
                <button id="btn-teleport">Go</button>
            </div>

            <!-- Menu HUD (Top Right) -->
            <div class="menu-hud">
                <button id="btn-menu" class="menu-btn">Menü</button>
            </div>

            <!-- Menu Overlay: Wenden / Steuerung / Zugmodell / Lautstärke -->
            <div id="menu-overlay" class="menu-overlay" style="display: none;">
                <div class="menu-content">
                    <div class="menu-header">
                        <h2>Menü</h2>
                        <button id="btn-menu-close" class="menu-close-btn" title="Schließen">✕</button>
                    </div>
                    <div class="menu-options">
                        <button id="btn-reverse" class="menu-option-btn" title="Fahrtrichtung wenden (nur im Stillstand bei geschlossenen Türen)">Wenden</button>
                        <button id="btn-controls" class="menu-option-btn" title="Steuerungstastaturbelegung anzeigen">Steuerung</button>
                        <button id="btn-model" class="menu-option-btn" title="Zugmodell wechseln (G1 / DT1)">Zugmodell: G1</button>
                        <div class="menu-volume-row">
                            <span class="volume-icon" title="Stummschalten/Aktivieren">🔊</span>
                            <label for="volume-slider">Lautstärke:</label>
                            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.6">
                            <span id="volume-value">60%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mobile Touch Controls (Bottom Left) - shown only on touch devices -->
            <div id="mobile-controls" class="mobile-controls">
                <div class="mobile-throttle-wrap">
                    <span class="mobile-throttle-label">Zug</span>
                    <input type="range" id="mobile-throttle-slider" class="mobile-throttle-slider" min="-100" max="100" step="1" value="0">
                    <span class="mobile-throttle-label">Bremse</span>
                </div>
                <button id="btn-mobile-doors" class="mobile-doors-btn" title="Türen freigeben / schließen">🚪</button>
            </div>

            <!-- Radio Popup Menu -->
            <div id="radio-popup" class="radio-overlay" style="display: none;">
                <div class="radio-content">
                    <div class="radio-station-nav">
                        <button id="radio-prev">&lt;</button>
                        <span id="radio-station-name">Classic Radio</span>
                        <button id="radio-next">&gt;</button>
                    </div>
                    <div class="radio-controls">
                        <button id="radio-off">Radio aus</button>
                        <button id="radio-close">Schließen</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Main Logic script -->
    <script type="module" src="./src/main.js?v=80"></script>
</body>
</html>
