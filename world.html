<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Welt | Dennis Münch</title>
    <meta name="description" content="Ein begehbares 3D-Portfolio: vom brutalistischen Atrium über den elysischen Garten und den Wilden Westen bis hinab zur U-Bahn-Kaverne.">
    <link rel="icon" href="./images/favicon/favicon.ico">
    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./src/world/world.css">

    <!-- ES Module Importmap for Three.js (self-hosted, no external CDN) -->
    <script type="importmap">
      {
        "imports": {
          "three": "./src/vendor/three/three.module.min.js",
          "three/addons/": "./src/vendor/three/addons/"
        }
      }
    </script>
</head>
<body>
    <!-- Splash / loading -->
    <div id="splash">
        <div class="splash-inner">
            <img src="./images/headertext.svg" alt="Dennis Münch" class="splash-logo">
            <p class="splash-sub">ATRIUM VIRTUALIS</p>
            <div id="load-bar"><div id="load-bar-fill"></div></div>
            <button id="btn-enter" disabled>LADEN&nbsp;…</button>
            <p class="splash-hint"><kbd>F</kbd>&nbsp;=&nbsp;Freecam&nbsp;·&nbsp;<a class="splash-link" href="./klassisch.html">Klassische&nbsp;Ansicht</a></p>
        </div>
    </div>

    <!-- 3D viewport -->
    <div id="canvas3d"></div>

    <!-- HUD -->
    <header id="hud-top">
        <div id="brand">DM</div>
        <nav id="wp-nav">
            <button data-wp="home">Start</button>
            <button data-wp="projects">Projekte</button>
            <button data-wp="about">Über&nbsp;mich</button>
            <button data-wp="contact">Kontakt</button>
        </nav>
    </header>
    <div id="wp-title"></div>
    <div id="toast"></div>
    <div id="scroll-hint">
        <span class="mouse"><span class="wheel"></span></span>
        <span>Scrollen&nbsp;zum&nbsp;Erkunden</span>
    </div>
    <a id="classic-link" href="./klassisch.html">Klassische&nbsp;Ansicht</a>

    <script type="module" src="./src/world/main.js"></script>
</body>
</html>
